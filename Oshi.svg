<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- oshi: block cursor on a buffer, with < / > scroll marks. pure
       geometry: 5 ruled lines, a green insertion block, and oshi's chevrons
       that appear when a line runs off the left/right edge. -->
  <rect width="128" height="128" rx="28" fill="#17191d"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="26.25"
        fill="none" stroke="#2a2e35" stroke-width="1.5"/>

  <!-- scroll marks: left and right chevrons -->
  <path d="M 18 74 L 28 64 L 28 84 Z" fill="#454c56"/>
  <path d="M 104 74 L 94 64 L 94 84 Z" fill="#454c56"/>

  <!-- buffer lines: dim text on a dark field -->
  <rect x="34" y="56" width="62" height="9" rx="4" fill="#3a3f46"/>
  <rect x="34" y="72" width="46" height="9" rx="4" fill="#3a3f46"/>
  <rect x="34" y="88" width="56" height="9" rx="4" fill="#3a3f46"/>
  <rect x="34" y="104" width="36" height="9" rx="4" fill="#3a3f46"/>

  <!-- block cursor, on the first line, with a highlight for depth -->
  <rect x="34" y="56" width="20" height="9" fill="#7fa563"/>
  <rect x="34" y="56" width="11" height="4" fill="#a8e68f"/>
</svg>
