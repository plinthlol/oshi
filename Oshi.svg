<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- oshi: a block cursor on a buffer. the green block is the -->
  <!-- insertion point (cursor_style block), on a field of dim text lines. -->
  <!-- pure geometry, no fonts: renders identically everywhere. -->
  <rect width="128" height="128" rx="28" fill="#17191d"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="26.25"
        fill="none" stroke="#2a2e35" stroke-width="1.5"/>

  <!-- buffer lines: dim, like text on a dark background -->
  <rect x="32" y="54" width="64" height="12" rx="6" fill="#454c56"/>
  <rect x="32" y="80" width="42" height="12" rx="6" fill="#454c56"/>

  <!-- the block cursor, sitting on the first line -->
  <rect x="32" y="54" width="22" height="12" fill="#7fa563"/>
</svg>
